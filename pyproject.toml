# Tooling configuration for the Halumar integration repository.
# Runtime metadata lives in custom_components/halumar/manifest.json;
# this file only configures the test suite (see requirements_test.txt).

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# Strict typing (quality scale rule strict-typing). CI runs mypy against the
# current HA release (requirements_test.txt): `mypy custom_components`.
[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-self", "truthy-iterable"]
